name: Warm Recoup Backend

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: warm-recoup-backend

jobs:
  warm-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh governed cockpit read models
        env:
          RECOUP_WARM_BACKEND_SECRET: ${{ secrets.RECOUP_WARM_BACKEND_SECRET }}
          WARM_BACKEND_URL: https://recoup-self-eta.vercel.app/api/cron/warm-backend
          WARM_BACKEND_FALLBACK_URL: https://recoup-api.onrender.com/healthz
        run: |
          warm_refresh() {
            url="$1"
            label="$2"
            response_file="/tmp/warm-response-${label}.json"
            status="$(curl -L -sS --connect-timeout 10 --max-time 70 -H "Authorization: Bearer ${RECOUP_WARM_BACKEND_SECRET}" -o "$response_file" -w "%{http_code}" "$url" || true)"
            echo "${label} status: ${status:-curl-error}"
            if [ -s "$response_file" ]; then
              cat "$response_file"
              echo
            fi
            [ "$status" = "200" ]
          }

          warm_public() {
            url="$1"
            label="$2"
            response_file="/tmp/warm-response-${label}.json"
            status="$(curl -L -sS --connect-timeout 10 --max-time 45 -o "$response_file" -w "%{http_code}" "$url" || true)"
            echo "${label} status: ${status:-curl-error}"
            [ "$status" = "200" ]
          }

          if warm_refresh "$WARM_BACKEND_URL" "vercel-refresh"; then
            exit 0
          fi

          echo "Initial cache refresh failed; waking Render before one governed refresh retry." >&2
          warm_public "$WARM_BACKEND_FALLBACK_URL" "render-wake" || true
          sleep 5

          if warm_refresh "$WARM_BACKEND_URL" "vercel-refresh-after-wake"; then
            exit 0
          fi

          echo "Governed Maya and David read-model refresh did not complete." >&2
          exit 1
