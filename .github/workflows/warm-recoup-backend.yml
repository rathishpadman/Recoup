name: Warm Recoup Backend

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: warm-recoup-backend

jobs:
  warm-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping warm-backend route
        env:
          WARM_BACKEND_URL: https://recoup-self-eta.vercel.app/api/cron/warm-backend
          WARM_BACKEND_FALLBACK_URL: https://recoup-api.onrender.com/healthz
        run: |
          warm_once() {
            url="$1"
            label="$2"
            response_file="/tmp/warm-response-${label}.json"
            status="$(curl -L -sS --connect-timeout 10 --max-time 25 -o "$response_file" -w "%{http_code}" "$url" || true)"
            echo "${label} status: ${status:-curl-error}"
            if [ -s "$response_file" ]; then
              cat "$response_file"
              echo
            fi
            [ "$status" = "200" ]
          }

          max_attempts=6
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            if warm_once "$WARM_BACKEND_URL" "vercel-attempt-${attempt}"; then
              exit 0
            fi

            echo "Attempt $attempt/$max_attempts expected 200 from $WARM_BACKEND_URL." >&2
            if [ "$attempt" = "$max_attempts" ]; then
              break
            fi

            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done

          echo "Vercel warm route did not return 200 after retries; falling back to Render healthz." >&2
          if warm_once "$WARM_BACKEND_FALLBACK_URL" "render-fallback"; then
            exit 0
          fi

          echo "Expected 200 from either warm path, but both failed." >&2
          exit 1
